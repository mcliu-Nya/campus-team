# 注意：这是 Docker Compose 草案，域名、证书、上游端口需按实际部署修改。
upstream campus_api {
    server api:3000;
}

# HTTP：仅用于证书签发跳转；上线后建议只保留 443。
server {
    listen 80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    # 统一 JSON 错误，避免 Nginx 默认 HTML 打断客户端解析
    error_page 502 503 504 = @upstream_down;

    location /api/ {
        proxy_pass http://campus_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location @upstream_down {
        default_type application/json;
        return 503 '{"success":false,"code":"UNKNOWN_ERROR","message":"服务暂时不可用，请稍后再试"}';
    }
}
