name: iOS unsigned ipa

# 在 GitHub 的 macOS runner 上编译出「未签名」的 .ipa：
# 产物不依赖 Apple 开发者账号，可用 Sideloadly / AltStore 在自己电脑上用它自动签名安装。
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: '构建时内联进 App 的 API 地址'
        required: false
        default: 'http://139.196.169.146/api'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_DATA_MODE: remote
      EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url }}
      EXPO_PUBLIC_API_TIMEOUT: '15000'
      CI: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show toolchain
        run: |
          node -v
          npm -v
          xcodebuild -version
          pod --version

      - name: Select latest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          xcodebuild -version

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native iOS project
        run: npx expo prebuild -p ios --no-install

      - name: Install Pods
        run: cd ios && pod install --repo-update

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          WORKSPACE=$(ls ios/*.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "workspace: $WORKSPACE"
          echo "scheme:    $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package ipa
        run: |
          set -euo pipefail
          APP=$(ls build/Build/Products/Release-iphoneos/*.app | head -n 1)
          echo "app: $APP"
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          BIN="$APP/$EXEC"
          lipo -info "$BIN"
          xcrun vtool -show-build "$BIN" | head -n 12
          rm -rf Payload campus-team-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry campus-team-unsigned.ipa Payload
          ls -lh campus-team-unsigned.ipa
          unzip -l campus-team-unsigned.ipa | head -n 5

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: campus-team-unsigned-ipa
          path: campus-team-unsigned.ipa
          retention-days: 30
